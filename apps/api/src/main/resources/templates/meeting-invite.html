<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title th:text="${title}">Meeting invitation</title>
</head>
<body style="margin:0;padding:24px;background:#f4f6f9;font:15px/1.6 -apple-system,Segoe UI,sans-serif;color:#1c2430;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #dde3ec;border-radius:10px;padding:28px;">

  <p style="margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6b7686;">
    Meeting invitation
  </p>
  <h1 style="margin:0 0 18px;font-size:21px;" th:text="${title}">Title</h1>

  <p style="margin:0 0 18px;" th:if="${agenda}" th:text="${agenda}">Agenda</p>

  <table style="width:100%;border-collapse:collapse;margin-bottom:22px;">
    <tr>
      <td style="padding:7px 0;color:#6b7686;width:92px;">When</td>
      <td style="padding:7px 0;"><strong th:text="${whenText}">When</strong></td>
    </tr>
    <tr>
      <td style="padding:7px 0;color:#6b7686;">Where</td>
      <td style="padding:7px 0;" th:text="${whereText}">Where</td>
    </tr>
    <tr>
      <td style="padding:7px 0;color:#6b7686;">Organiser</td>
      <td style="padding:7px 0;" th:text="${organiser}">Organiser</td>
    </tr>
    <tr>
      <td style="padding:7px 0;color:#6b7686;">Seats held</td>
      <td style="padding:7px 0;" th:text="${seatsText}">Seats</td>
    </tr>
  </table>

  <p style="margin:0 0 10px;color:#6b7686;font-size:13px;">Can you make it?</p>
  <a th:href="${acceptUrl}"
     style="display:inline-block;padding:10px 20px;background:#1f6feb;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;">
    Accept
  </a>
  <a th:href="${declineUrl}"
     style="display:inline-block;padding:10px 20px;margin-left:8px;border:1px solid #c9d2df;color:#1c2430;text-decoration:none;border-radius:6px;">
    Decline
  </a>

  <p style="margin:22px 0 0;font-size:12px;color:#8b94a3;">
    The calendar invitation is attached, so you can also accept from your calendar.
  </p>
</div>
</body>
</html>
