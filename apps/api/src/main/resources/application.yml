spring:
  application:
    name: seat-booking-api

  datasource:
    url: jdbc:postgresql://localhost:5432/seatbooking
    username: seatbooking
    password: seatbooking

  jpa:
    # Explicit SQL migrations own the schema. Hibernate only checks that the entities
    # still match it, because this schema uses an extension, a generated column and an
    # exclusion constraint that Hibernate DDL cannot express.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SEATBOOKING_SMTP_HOST:localhost}
    port: ${SEATBOOKING_SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  thymeleaf:
    check-template-location: true

  # Blocking JPA on virtual threads. Deliberately not WebFlux: SseEmitter works well and
  # the reactive programming tax buys nothing at this scale.
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  error:
    include-message: always

seatbooking:
  auth:
    # Dev-only default. Override with SEATBOOKING_AUTH_JWT_SECRET in any real deployment;
    # the application refuses to start with this value when a prod profile is active.
    jwt-secret: ${SEATBOOKING_AUTH_JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    access-token-ttl: PT15M
    refresh-token-ttl: P14D
  booking:
    max-advance: P6D
    max-duration: PT6H
  mail:
    from: no-reply@seatbooking.test
    # Where an invitee's accept/decline link points. Mailpit shows the mail at :8025.
    public-base-url: ${SEATBOOKING_PUBLIC_URL:http://localhost:3000}
    # The worker claims a small batch each tick; SMTP is slow and this is not a race.
    batch-size: 25

# Redis (multi-instance SSE) is deliberately absent: its starter is not on the classpath
# yet, and configuration for a dependency that is not there reads like working wiring.

logging:
  level:
    org.flywaydb: INFO
